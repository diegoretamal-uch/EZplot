[project]
name = "ezplot"
version = "0.1.3"
description = "Publication-quality volcano, heatmap and GSEA plots from iDEP output"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "shiny>=1.2",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "adjustText>=1.1",
    "pillow>=10",
]

[project.scripts]
ezplot = "ezplot.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=8",
    "shinylive>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ezplot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
